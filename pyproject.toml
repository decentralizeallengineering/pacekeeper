[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pacekeeper"
version = "0.1.0"
description = "Claude Code usage meters, spend accounting and pacing advice, stdlib only"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
pacekeeper = "pacekeeper.cli:main"

[tool.setuptools]
packages = ["pacekeeper"]
